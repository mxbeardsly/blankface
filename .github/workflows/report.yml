name: Weekly report
on:
  schedule:
    - cron: "7 14 * * 0"    # Sundays
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: bot-state
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python run.py report
      - name: Save bot state
        if: always()
        run: |
          git config user.name "blankface-bot"
          git config user.email "blankface-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "bot: report state $(date -u +%F_%H%M)"
          git pull --rebase --autostash && git push
